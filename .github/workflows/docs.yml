name: Documentation

on:
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'scripts/build_docs.py'
      - 'dev_tests/test_docs_site.py'
      - 'docs/**'
      - 'README.md'
      - 'misc/**'
      - 'nif/**'
      - 'requirements.txt'
      - 'setup.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'scripts/build_docs.py'
      - 'dev_tests/test_docs_site.py'
      - 'docs/**'
      - 'README.md'
      - 'misc/**'
      - 'nif/**'
      - 'requirements.txt'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PyTorch documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation and implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and documentation tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . -r docs/requirements.txt pytest
      - name: Verify source preparation and preserved assets
        run: python -m pytest dev_tests/test_docs_site.py -q
      - name: Build the current API and retain legacy documentation
        run: python scripts/build_docs.py --output dev_tests/artifacts/pages/html
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dev_tests/artifacts/pages/html

  deploy:
    name: Deploy documentation to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure the existing Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated documentation artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yaml'
      - 'scripts/check_release.py'
      - 'dev_tests/test_release_metadata.py'
      - 'nif/**'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'requirements.txt'
      - 'CITATION.cff'
      - '.zenodo.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yaml'
      - 'scripts/check_release.py'
      - 'dev_tests/test_release_metadata.py'
      - 'nif/**'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'requirements.txt'
      - 'CITATION.cff'
      - '.zenodo.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag, for example v2.0.0'
        type: string
        required: true
      publish_pypi:
        description: 'Also upload the validated distributions to PyPI'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact candidate or release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install release tools
        run: python -m pip install build twine cffconvert pytest
      - name: Validate release metadata and tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/check_release.py --tag "$RELEASE_TAG"
          else
            python scripts/check_release.py
          fi
          if [ "$MANUAL_RUN" = true ]; then
            gh release view "$RELEASE_TAG" --json tagName,isDraft > release.json
            python -c 'import json, os; r = json.load(open("release.json")); assert r["tagName"] == os.environ["RELEASE_TAG"] and not r["isDraft"], "Manual uploads require an existing published release"'
          fi
          cffconvert --validate
          python -m pytest dev_tests/test_release_metadata.py -q
      - name: Build and check the source and wheel distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_release.py --dist dist
      - name: Store validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nif-distributions
          path: dist/*
          if-no-files-found: error

  release-assets:
    name: Attach distributions to the GitHub release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nif-distributions
          path: dist
      - name: Attach assets to the published tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*

  publish-pypi:
    name: Publish to PyPI by explicit manual request
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nif-distributions
          path: dist
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          attestations: false

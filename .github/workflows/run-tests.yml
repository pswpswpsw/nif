name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Linting
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files

  regressions:
    name: Current CPU regressions and frozen historical audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      NIF_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CPU regression dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,tensorboard]' -r examples/self_scaled/requirements.txt
      - name: Check generated tutorial listings
        run: python scripts/tutorial_catalog.py --check
      - name: Test the current implementation
        run: python -m pytest dev_tests -q
      - name: Run all eight released tutorials in explicit SMOKE mode
        run: python dev_tests/run_native_notebooks.py --output dev_tests/artifacts/native-smoke
      - name: Audit the frozen historical publication
        run: python -m dev_tests.provenance audit --output dev_tests/artifacts/historical-audit

name: Scalar runtime diagnostic

on:
  push:
    branches: [codex/ci-scalar-portability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Compare scalar reference dispatch (${{ matrix.replica }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      CUDA_VISIBLE_DEVICES: ''
      NIF_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install the unchanged regression environment
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . -r examples/self_scaled/requirements.txt pytest
      - name: Record default and baseline NumPy power dispatch
        run: python scripts/diagnose_scalar_runtime.py --output-dir dev_tests/artifacts/scalar-diagnostic
      - name: Observe historical audit with automatic dispatch
        continue-on-error: true
        run: python -m dev_tests.provenance audit --output dev_tests/artifacts/history-automatic
      - name: Verify historical audit with baseline scalar power
        env:
          NPY_DISABLE_CPU_FEATURES: AVX512_SKX
        run: python -m dev_tests.provenance audit --output dev_tests/artifacts/history-baseline

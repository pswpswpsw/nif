name: Experimental self-scaled tutorial

on:
  pull_request:
    paths:
      - '.github/workflows/self-scaled.yml'
      - 'examples/self_scaled/**'
      - 'tutorial/9_self_scaled_optimizers_pytorch.ipynb'
      - 'dev_tests/test_self_scaled_tutorial.py'
      - 'nif/**'
      - 'requirements.txt'
      - 'setup.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-scaled.yml'
      - 'examples/self_scaled/**'
      - 'tutorial/9_self_scaled_optimizers_pytorch.ipynb'
      - 'dev_tests/test_self_scaled_tutorial.py'
      - 'nif/**'
      - 'requirements.txt'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-scaled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify experimental CPU comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - name: Check out tutorial and implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned experiment dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . -r examples/self_scaled/requirements.txt pytest ipython
      - name: Check optimizer bridge, data mapping and notebook contracts
        run: python -m pytest dev_tests/test_self_scaled_tutorial.py -q
      - name: Run explicitly shortened fixed-data comparison
        run: python examples/self_scaled/benchmark.py --smoke --output dev_tests/artifacts/self_scaled_ci
